<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Mission Rückkehr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: Zeitmaschinen-Konsole (dunkel): oben Anzeige mit Treibstoff, darunter die geologische Zeitskala,
   darunter Szene des Zeitalters und eine helle Arbeitsplatte für die Aufgaben. Overlays für Film, Game over und Sprung. */
:root {
  color-scheme: dark;
  --night: #0D181B;
  --console: #15262A;
  --line: #2C444A;
  --glow: #5CE1CB;
  --amber: #F4B03E;
  --paper: #EEF1EC;
  --muted-d: #93AEB0;
  --stone: #E5E7DF;
  --stone-2: #D4D8CD;
  --stone-3: #BFC5B8;
  --ink: #1B2426;
  --ink-2: #4E5D5F;
  --sel: #0E7F70;
  --ok: #24864F; --ok-bg: #DDEFE3;
  --bad: #B6412A; --bad-bg: #F5DDD5;
  --info-bg: #F1E8CF;
  --blood: #7A1E14;
  --white: #FFFFFF;
  --f-display: "Chakra Petch", "Avenir Next Condensed", "DIN Alternate", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --scene-h: clamp(76px, 19vh, 200px);
  --hero-h: clamp(120px, min(38vh, 30vw), 380px);
}
html { height: 100%; }
body {
  margin: 0; height: 100%; height: 100dvh; overflow: hidden;
  background: var(--night); color: var(--paper);
  font-family: var(--f-body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-text-size-adjust: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
button, input { font: inherit; }
button { -webkit-appearance: none; appearance: none; }
:focus-visible { outline: 3px solid var(--glow); outline-offset: 2px; }
svg { overflow: hidden; }

/* ---------- Konsole ---------- */
.hud { display: flex; align-items: center; gap: 8px 18px; padding-block: 8px 4px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 14px; color: var(--glow); user-select: none; -webkit-user-select: none; line-height: 1.15; cursor: default; }
.brand small { display: block; color: var(--muted-d); letter-spacing: .08em; font-weight: 500; font-size: 11.5px; text-transform: none; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.readout { font-family: var(--f-display); font-size: 19px; font-weight: 600; letter-spacing: .04em; line-height: 1.12; min-width: 0; }
.readout span { display: block; font-size: 12.5px; font-weight: 500; color: var(--muted-d); letter-spacing: .05em; }
.fuel { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.fuel .fl { font-family: var(--f-display); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-d); text-align: right; line-height: 1.2; }
.fuel .fl b { display: block; color: var(--paper); font-size: 15px; letter-spacing: .04em; }
.cells { display: flex; gap: 3px; position: relative; padding: 4px; border: 1.5px solid var(--line); border-radius: 9px; background: var(--console); }
.cells i { width: 13px; height: 26px; border-radius: 3px; background: #22383D; transition: background .3s; }
.cells i.on { background: var(--glow); box-shadow: 0 0 8px rgba(92,225,203,.6); }
.cells i.red { background: var(--bad); }
.cells i.pop { animation: pop .45s ease; }
.cells i.mark { margin-left: 6px; }
.cells i.mark::before { content: ""; position: absolute; }
.cells .th { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--amber); border-radius: 1px; }
.cells.ready { border-color: var(--glow); }
.lives { display: flex; align-items: center; gap: 6px; font-family: var(--f-display); font-size: 15px; color: var(--muted-d); }
.lives svg { width: 22px; height: 22px; color: var(--muted-d); }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }

.timeline { position: relative; padding-block: 16px 2px; }
.tl-bar { display: flex; height: 9px; border-radius: 5px; overflow: hidden; }
.tl-bar i { display: block; height: 100%; }
.tl-bar i.pre { background: repeating-linear-gradient(135deg, #3B4447 0 4px, #2A3235 4px 8px); }
.tl-groups { position: relative; height: 15px; font-family: var(--f-display); font-size: 10.5px; letter-spacing: .06em; color: var(--muted-d); }
.tl-groups span { position: absolute; top: 2px; white-space: nowrap; transform: translateX(-50%); }
.tl-groups span::before { content: ""; position: absolute; left: 50%; top: -4px; height: 3px; width: 1px; background: var(--muted-d); }
.tl-mark { position: absolute; top: 0; transform: translateX(-50%); transition: left 1.2s cubic-bezier(.6,0,.3,1); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.tl-mark b { font-family: var(--f-display); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); white-space: nowrap; }
.tl-mark i { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--amber); }

main { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; min-height: 0; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); }
.stage { margin-top: 6px; }
.scene { position: relative; height: var(--scene-h); border-radius: 16px 16px 0 0; overflow: hidden; background: var(--console); }
.scene.hero { height: var(--hero-h); }
.scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .tag { position: absolute; left: 12px; top: 10px; display: flex; align-items: center; gap: 8px; background: rgba(9,17,19,.78); border-radius: 9px; padding: 5px 10px 5px 6px; }
.tag .era { font-family: var(--f-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: 13.5px; padding: 2px 8px; border-radius: 5px; }
.tag .ago { font-family: var(--f-display); font-size: 13px; color: var(--paper); letter-spacing: .03em; }
.panel { background: var(--stone); color: var(--ink); border-radius: 0 0 16px 16px; padding: 18px clamp(14px, 3vw, 28px) 22px; }

/* Bordcomputer Z-8 */
.z8 { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: start; margin-bottom: 14px; }
.z8-ava { width: 64px; height: 54px; background: var(--night); border-radius: 12px; display: grid; place-items: center; }
.z8-ava svg { width: 56px; height: 46px; }
.z8-msg { background: var(--night); color: var(--paper); border-radius: 4px 14px 14px 14px; padding: 10px 14px; min-height: 44px; }
.z8-msg b { font-family: var(--f-display); letter-spacing: .12em; color: var(--glow); font-size: 12.5px; display: block; }
.z8-msg p { margin: 2px 0 0; font-size: 17.5px; line-height: 1.4; }
.z8-msg p + p { margin-top: 6px; }
.tk-how { font-size: 15px; color: var(--ink-2); margin: -4px 0 12px; }
.tk-n { font-family: var(--f-display); font-weight: 700; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--sel); margin-bottom: 6px; }

/* Knöpfe und Rückmeldungen */
.btn { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: .05em; border-radius: 12px; padding: 12px 22px; min-height: 52px; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; color: #1D1505; background: var(--amber); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--stone-3); }
.btn.ghost.dark { color: var(--paper); border-color: var(--line); }
.btn.teal { background: var(--glow); }
.btn.red { background: #E2563C; color: #FFFFFF; }
.btn[disabled] { opacity: .4; cursor: default; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.actions .grow { flex: 1; }
.fb { margin-top: 12px; padding: 11px 15px; border-radius: 12px; font-size: 16.5px; max-width: 80ch; }
.fb:empty { display: none; }
.fb.info { background: var(--info-bg); }
.fb.ok { background: var(--ok-bg); border-left: 5px solid var(--ok); }
.fb.bad { background: var(--bad-bg); border-left: 5px solid var(--bad); }

/* Kärtchen und Ziele */
.pool { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; background: var(--stone-2); border-radius: 12px; min-height: 64px; align-content: flex-start; }
.pool:empty::before { content: "Alle Kärtchen sind verteilt."; color: var(--ink-2); font-size: 15px; align-self: center; padding-left: 4px; }
.pool-l { font-family: var(--f-display); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); margin: 0 0 6px; }
.tray { position: sticky; bottom: 0; z-index: 4; background: var(--stone); padding: 10px 0 6px; margin-top: 12px; border-top: 1px solid var(--stone-3); }
.chip { max-width: 100%; background: var(--white); color: var(--ink); border: 2px solid var(--stone-3); border-radius: 10px; padding: 8px 13px; min-height: 48px; display: inline-flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; font-size: 16.5px; line-height: 1.25; }
.chip .ci { display: inline-grid; place-items: center; flex: none; }
.chip small { display: block; color: var(--ink-2); font-size: 13.5px; line-height: 1.25; margin-top: 2px; }
.chip.sel { border-color: var(--sel); box-shadow: 0 0 0 3px rgba(14,127,112,.35); }
.chip.ok { border-color: var(--ok); background: #EDF7F0; cursor: default; }
.chip.bad { border-color: var(--bad); background: var(--bad-bg); cursor: default; }
.chip .fix { display: block; font-size: 13.5px; font-weight: 700; color: var(--bad); margin-top: 3px; }
.chip.shake { animation: shake .45s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.tile { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 9px; }
.tile svg { width: 32px; height: 32px; display: block; }
.zone { border: 2px dashed #98A196; border-radius: 12px; background: rgba(255,255,255,.55); min-height: 56px; padding: 7px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; cursor: pointer; min-width: 0; }
.zone.armed { border-color: var(--sel); border-style: solid; background: rgba(14,127,112,.08); }
.locked .zone { cursor: default; }
.num { width: 36px; height: 36px; border-radius: 50%; background: var(--sel); color: var(--white); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; flex: none; }

.lab { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.lab figure { margin: 0; background: var(--white); border-radius: 14px; padding: 6px; }
.lab figure svg { width: 100%; height: auto; max-height: 38vh; display: block; }
.lab .rows { display: grid; gap: 10px; }
.lrow { display: grid; grid-template-columns: 40px minmax(0,1fr); gap: 10px; align-items: center; }
.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.bin { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.bin-h { font-family: var(--f-display); font-weight: 700; letter-spacing: .05em; font-size: 17px; padding: 7px 12px; border-radius: 10px; background: var(--ink); color: var(--paper); }
.bin-h small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 13.5px; letter-spacing: 0; opacity: .8; }
.bin .zone { min-height: 130px; align-content: flex-start; }
.order { display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 10px; }
.oslot { display: flex; flex-direction: column; gap: 6px; min-width: 0; align-items: stretch; }
.oslot .num { margin: 0 auto; }
.oslot .zone { min-height: 128px; padding: 5px; align-items: stretch; justify-content: center; }
.order-hint { display: flex; justify-content: space-between; font-family: var(--f-display); font-size: 12.5px; letter-spacing: .06em; color: var(--ink-2); margin-top: 6px; }
.chip.card { flex-direction: column; align-items: stretch; gap: 5px; padding: 6px 8px 8px; font-size: 15px; width: 100%; }
.pool .chip.card { width: calc(25% - 8px); min-width: 150px; }
.chip.card .ci svg { width: 100%; height: 64px; display: block; }
.wt { background: #F0EDE4; border-radius: 7px; padding: 4px; color: #3E3328; }
.match { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 10px 18px; }
.mrow { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 10px; align-items: center; }
.mrow .cat { font-weight: 700; font-size: 17px; line-height: 1.2; }
.cloze { font-size: 18.5px; line-height: 2.3; max-width: 80ch; background: var(--white); border-radius: 14px; padding: 12px 16px; }
.zone.gap { display: inline-flex; min-height: 44px; min-width: 140px; padding: 3px 6px; vertical-align: middle; margin: 2px; line-height: 1.2; }
.zone.gap .chip { min-height: 36px; padding: 4px 10px; }
.zone .fixw { font-size: 14px; font-weight: 700; color: var(--bad); padding: 0 4px; }

/* Ja-nein-Karten */
.yn { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: center; background: var(--white); border-radius: 14px; padding: 14px 16px; }
.yn .tile { width: 112px; height: 112px; border-radius: 14px; }
.yn .tile svg { width: 80px; height: 80px; }
.yn q { display: block; font-size: 20px; font-weight: 700; line-height: 1.35; quotes: none; }
.yn .cnt { font-family: var(--f-display); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.two { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
.opt { flex: 1 1 200px; background: var(--white); border: 2px solid var(--stone-3); border-radius: 12px; padding: 12px 16px; min-height: 56px; cursor: pointer; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 19px; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.prog { display: flex; gap: 6px; margin: 0 0 10px; }
.prog i { width: 26px; height: 6px; border-radius: 3px; background: var(--stone-3); }
.prog i.ok { background: var(--ok); } .prog i.bad { background: var(--bad); } .prog i.cur { background: var(--sel); }

/* Portale */
.portals { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.portal { background: var(--night); color: var(--paper); border: 0; border-radius: 16px; padding: 16px 14px 18px; cursor: pointer; display: grid; justify-items: center; gap: 12px; text-align: center; font-size: 17px; line-height: 1.3; }
.portal .ring { width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; position: relative; }
.portal .ring::before, .portal .ring::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--glow); border-color: var(--glow) transparent var(--glow) transparent; animation: spin 2.4s linear infinite; }
.portal .ring::after { inset: -14px; border-color: transparent var(--amber) transparent var(--amber); border-width: 2px; animation-duration: 3.6s; animation-direction: reverse; }
.portal .ring span { display: flex; gap: 2px; }
.portal .ring svg { width: 48px; height: 48px; }
.portal:active { transform: scale(.98); }

/* Zeitsturm */
.track { position: relative; height: 54px; background: var(--night); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
.track .rail { position: absolute; left: 50px; right: 70px; top: 26px; height: 3px; background: repeating-linear-gradient(90deg, #3E5A60 0 10px, transparent 10px 18px); }
.track .home { position: absolute; right: 12px; top: 8px; font-family: var(--f-display); font-size: 12px; color: var(--glow); letter-spacing: .1em; text-align: center; line-height: 1.1; }
.track .home svg { width: 22px; height: 22px; display: block; margin: 0 auto; color: var(--glow); }
.track .ship { position: absolute; top: 4px; width: 62px; height: 46px; transition: left .8s cubic-bezier(.5,0,.3,1); }
.track .ship svg { width: 100%; height: 100%; }
.timer { height: 8px; border-radius: 4px; background: var(--stone-2); overflow: hidden; margin: 10px 0 0; }
.timer i { display: block; height: 100%; background: var(--sel); width: 100%; }
.timer.low i { background: var(--bad); }
.st-card { background: var(--white); border-radius: 14px; padding: 16px 18px; }
.st-card q { display: block; font-size: 21px; font-weight: 700; line-height: 1.35; quotes: "„" "“"; }
.st-card .cnt { font-family: var(--f-display); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }

/* Start und Diplom */
.hero-sub { font-family: var(--f-display); font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--sel); margin: 0 0 4px; }
.hero-h { font-family: var(--f-display); font-weight: 700; font-size: clamp(34px, 6vw, 58px); line-height: 1; letter-spacing: .02em; margin: 0 0 10px; text-transform: uppercase; color: var(--ink); }
.crew { display: grid; gap: 6px; max-width: 420px; margin: 12px 0 2px; }
.crew label { font-family: var(--f-display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.crew input { font-size: 18px; padding: 11px 14px; border-radius: 10px; border: 2px solid var(--stone-3); background: var(--white); color: var(--ink); min-height: 50px; }
.crew input:focus { outline: 3px solid var(--sel); border-color: var(--sel); }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 16px 0 4px; padding: 0; list-style: none; }
.rules li { background: var(--white); border-radius: 12px; padding: 11px 13px; font-size: 15.5px; }
.rules li b { display: block; font-family: var(--f-display); letter-spacing: .06em; color: var(--sel); font-size: 13.5px; text-transform: uppercase; }
.credits { margin-top: 16px; font-size: 13px; color: var(--ink-2); }
.diploma { position: relative; background: #FBF7EC; border: 2px solid #D9CBA4; border-radius: 18px; padding: 22px clamp(16px, 4vw, 40px); text-align: center; box-shadow: inset 0 0 0 6px #FBF7EC, inset 0 0 0 8px #E5D8B5; }
.diploma .trophy { width: 84px; height: 84px; color: #C08A1E; margin: 0 auto 4px; display: block; }
.diploma .dk { font-family: var(--f-display); letter-spacing: .3em; text-transform: uppercase; color: #8A7552; font-size: 14px; }
.diploma h1 { font-family: var(--f-display); font-size: clamp(28px, 5vw, 44px); margin: 4px 0 6px; color: var(--ink); line-height: 1.05; }
.diploma p { margin: 0 auto; max-width: 52ch; color: var(--ink-2); font-size: 17px; }
.stats { display: flex; justify-content: center; gap: 10px 26px; flex-wrap: wrap; margin: 16px 0 6px; }
.stats div { font-family: var(--f-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #8A7552; }
.stats b { display: block; font-size: 28px; color: var(--ink); letter-spacing: .02em; }
.rank { display: inline-block; margin-top: 10px; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; background: var(--ink); color: var(--amber); padding: 6px 14px; border-radius: 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall 3.2s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

/* ---------- Overlays ---------- */
.ov { position: fixed; inset: 0; z-index: 50; background: var(--night); color: var(--paper); display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fadein .3s ease; }
.ov.out { animation: fadeout .35s ease forwards; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeout { to { opacity: 0; } }
.ov-stage { position: relative; min-height: 0; overflow: hidden; border-radius: 0 0 18px 18px; }
.ov-stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ov-bottom { width: 100%; max-width: 980px; margin: 0 auto; padding-top: 14px; }
.cap { font-size: clamp(19px, 2.6vw, 25px); line-height: 1.4; min-height: 3.2em; }
.cap p { margin: 0 0 6px; }
.cap .who { font-family: var(--f-display); color: var(--glow); letter-spacing: .12em; font-size: .7em; display: block; }
.ov .actions { justify-content: space-between; }
.skip { background: transparent; border: 0; color: var(--muted-d); font-family: var(--f-display); letter-spacing: .08em; font-size: 15px; cursor: pointer; padding: 10px 6px; min-height: 44px; }
.count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.count b { font-family: var(--f-display); font-size: clamp(80px, 22vh, 200px); color: var(--amber); text-shadow: 0 0 30px rgba(244,176,62,.7); opacity: 0; animation: cnt 1s ease forwards; }
@keyframes cnt { 0% { opacity: 0; transform: scale(1.6); } 30% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; transform: scale(.8); } }
.alarm { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
.alarm b { font-family: var(--f-display); font-size: clamp(34px, 8vw, 80px); letter-spacing: .1em; color: #FF5A3C; text-shadow: 0 0 24px rgba(255,70,40,.8); animation: blinkA .5s steps(2) infinite; display: block; }
.alarm span { display: block; font-family: var(--f-display); font-size: clamp(20px, 3.4vw, 32px); color: var(--amber); margin-top: 8px; font-variant-numeric: tabular-nums; }
.redwash { position: absolute; inset: 0; background: rgba(255,40,20,.18); animation: blinkA .5s steps(2) infinite; pointer-events: none; }
@keyframes blinkA { 50% { opacity: .25; } }

/* Game over */
.death { background: #140707; grid-template-rows: auto minmax(0, 1fr); }
.death .ov-stage { height: clamp(90px, 26vh, 260px); filter: grayscale(.75) brightness(.6); border-radius: 0 0 18px 18px; }
.death .ov-stage::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(120,10,0,.55) 100%); }
.death .scroll { overflow-y: auto; min-height: 0; }
.death .ov-bottom { padding-bottom: 8px; }
.go { font-family: var(--f-display); font-weight: 700; font-size: clamp(38px, 8vw, 72px); letter-spacing: .1em; color: #FF5A3C; text-shadow: 0 0 22px rgba(255,70,40,.6); line-height: 1; margin-top: 8px; animation: goIn .8s ease; }
@keyframes goIn { from { letter-spacing: .6em; opacity: 0; } to { letter-spacing: .1em; opacity: 1; } }
.death h2 { margin: 6px 0 10px; font-size: 22px; color: #F5D6CF; }
.dlines { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.dlines li { font-size: 17.5px; line-height: 1.4; color: #EEDCD8; opacity: 0; transform: translateY(6px); transition: opacity .4s, transform .4s; }
.dlines li.in { opacity: 1; transform: none; }
.find { margin-top: 14px; background: #F3EBDA; color: #2A2018; border-radius: 12px; padding: 12px 16px; opacity: 0; transition: opacity .5s; border-left: 6px solid #8A7552; }
.find.in { opacity: 1; }
.find .fk { font-family: var(--f-display); font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: #8A7552; }
.find .ff { font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.find p { margin: 4px 0 0; font-size: 16px; }

/* Zeitsprung */
.jump { place-items: center; grid-template-rows: auto; text-align: center; background: radial-gradient(circle at 50% 50%, #12343A 0%, var(--night) 62%); }
.rings { position: relative; width: 210px; height: 210px; margin: 0 auto 16px; }
.rings i { position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--glow); border-color: var(--glow) transparent var(--glow) transparent; animation: spin 1.1s linear infinite; }
.rings i:nth-child(2) { inset: 26px; border-color: transparent var(--amber) transparent var(--amber); animation-duration: .8s; animation-direction: reverse; }
.rings i:nth-child(3) { inset: 54px; border-color: var(--glow) transparent transparent transparent; animation-duration: .55s; }
.rings b { position: absolute; inset: 82px; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0%, var(--glow) 45%, transparent 72%); animation: pulse .7s ease-in-out infinite alternate; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { from { transform: scale(.7); opacity: .7; } to { transform: scale(1.15); opacity: 1; } }
.jump h2 { font-family: var(--f-display); font-size: 15px; letter-spacing: .3em; text-transform: uppercase; color: var(--glow); margin: 0 0 6px; }
.jump .to { font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 6vw, 48px); letter-spacing: .06em; text-transform: uppercase; }
.jump .cnt { font-family: var(--f-display); font-size: 22px; color: var(--amber); margin-top: 6px; font-variant-numeric: tabular-nums; }

/* Lehrkraft */
.teach { position: fixed; inset: 0; z-index: 70; background: rgba(5,10,12,.88); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.teach .box { background: var(--stone); color: var(--ink); border-radius: 16px; padding: 20px; max-width: 600px; width: 100%; }
.teach .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 10px 0; }
.teach label { display: flex; gap: 10px; align-items: center; font-size: 17px; padding: 6px 0; }
.teach input[type=checkbox] { width: 24px; height: 24px; }

/* SVG-Animationen in den Szenen */
.spin { transform-box: fill-box; transform-origin: center; animation: spin 3s linear infinite; }
.spin.rev { animation-direction: reverse; animation-duration: 4.5s; }
.blink { animation: blinkA 1s steps(2) infinite; }
.rise { animation: rise 2.6s ease-in infinite; transform-box: fill-box; }
.rise.d1 { animation-delay: .6s; } .rise.d2 { animation-delay: 1.2s; } .rise.d3 { animation-delay: 1.8s; }
@keyframes rise { 0% { transform: translateY(8px); opacity: 0; } 30% { opacity: .8; } 100% { transform: translateY(-26px); opacity: 0; } }
.bob { animation: bob 3.4s ease-in-out infinite alternate; transform-box: fill-box; }
.bob.d2 { animation-delay: 1.2s; }
@keyframes bob { to { transform: translateY(8px); } }
.fall { animation: snow 5s linear infinite; transform-box: fill-box; }
.fall.d1 { animation-delay: -1.2s; } .fall.d2 { animation-delay: -2.5s; } .fall.d3 { animation-delay: -3.7s; }
@keyframes snow { from { transform: translateY(-20px); } to { transform: translateY(40px); } }
.flash { animation: flash 2.2s steps(1) infinite; }
.flash.d1 { animation-delay: .5s; } .flash.d2 { animation-delay: 1.1s; } .flash.d3 { animation-delay: 1.6s; }
@keyframes flash { 0%, 100% { opacity: 0; } 8%, 14% { opacity: 1; } 10% { opacity: .2; } }
.flashc { animation: flashc 1.2s ease-out forwards; }
@keyframes flashc { 0% { opacity: 1; } 100% { opacity: 0; } }
.shake { animation: shakeS .35s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes shakeS { 0%,100% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-3px,1px) rotate(-2deg); } 75% { transform: translate(3px,-1px) rotate(2deg); } }

@media (hover: hover) {
  .btn:hover { filter: brightness(1.05); }
  .portal:hover { box-shadow: 0 0 0 3px var(--glow); }
  .chip:not(.ok):not(.bad):hover { border-color: var(--sel); }
}
@media (max-width: 760px) {
  body { font-size: 17px; }
  .lab { grid-template-columns: minmax(0, 1fr); }
  .order { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pool .chip.card { width: calc(50% - 5px); min-width: 0; }
  .match { grid-template-columns: minmax(0, 1fr); }
  .mrow { grid-template-columns: 112px minmax(0,1fr); }
  .tray { position: static; }
  .fuel .fl { display: none; }
  .cells i { width: 10px; height: 22px; }
  .yn { grid-template-columns: 72px minmax(0,1fr); }
  .yn .tile { width: 72px; height: 72px; } .yn .tile svg { width: 52px; height: 52px; }
  .z8 { grid-template-columns: 48px minmax(0, 1fr); }
  .z8-ava { width: 48px; height: 42px; } .z8-ava svg { width: 42px; height: 34px; }
}
@media (max-height: 640px) {
  :root { --scene-h: clamp(64px, 15vh, 120px); --hero-h: clamp(100px, 30vh, 220px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
.cells em.sep { width: 2px; align-self: stretch; background: var(--amber); border-radius: 1px; margin: -3px 2px; }
.count b { grid-area: 1 / 1; }
@media (max-width: 560px) { .tl-groups { display: none; } .timeline { padding-bottom: 6px; } }
/* Kartenablage: eine Zeile zum Wischen, damit die Ziele sichtbar bleiben */
.tray .pool { flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; align-items: stretch; }
.tray .chip { flex: 0 0 auto; max-width: 300px; scroll-snap-align: start; }
.tray .chip.card { width: 176px; min-width: 0; }
.tray .pool::-webkit-scrollbar { height: 8px; }
.tray .pool::-webkit-scrollbar-thumb { background: var(--stone-3); border-radius: 4px; }
@media (max-width: 760px) {
  .tray .pool { flex-wrap: wrap; overflow-x: visible; }
  .tray .chip { flex: 0 1 auto; max-width: 100%; }
  .tray .chip.card { width: calc(50% - 5px); }
}
@media (max-width: 760px) { .swipe { display: none; } }
/* Filmsequenz: Bild mittig, nicht bildschirmhoch */
.ov.cine { grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr); }
.ov.cine > .ov-stage { grid-row: 2; height: max(150px, min(56vh, 36vw)); width: 100%; max-width: 1180px; margin: 0 auto; border-radius: 18px; }
.ov.cine > .ov-bottom { grid-row: 3; }

</style>

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a, n) => shuffle(a).slice(0, n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function textOn(hex) { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#1B2426" : "#FFFFFF"; }
function glyph(name, cls) {
  if (SHAPE[name]) return `<svg class="${cls || "ic"}" viewBox="${SHAPE[name].vb}" aria-hidden="true"><g fill="currentColor">${SHAPE[name].d}</g></svg>`;
  return `<svg class="${cls || "ic"}" viewBox="0 0 512 512" aria-hidden="true"><g fill="currentColor">${ICON[name]}</g></svg>`;
}
const tile = (name, bg, fg) => `<span class="tile" style="background:${bg};color:${fg || textOn(bg)}">${glyph(name)}</span>`;

  }
  const m = $("#tlm"); m.style.left = `clamp(36px, ${tlPos(ma)}%, calc(100% - 36px))`; m.querySelector("b").textContent = e;
}
function fuelGauge(popIdx) {
  const st = S.screen === "storm" && S.storm;
  const val = st ? S.storm.ok : S.fuel;
  let cells = "";
  for (let i = 0; i < 10; i++) {
    let c = "";
    if (st) c = i < S.storm.ok ? "on" : (i >= 10 - S.storm.bad ? "red" : "");
    else c = i < S.fuel ? "on" : "";
    if (i === popIdx) c += " pop";
    cells += (i === NEED ? '<em class="sep"></em>' : "") + `<i class="${c}"></i>`;
  }
  const f = $("#fuel"); if (!f) return;
  f.innerHTML = `<div class="fl">${st ? "Stabilität" : "Treibstoff"}<b>${val} / 10</b></div><div class="cells${val >= NEED ? " ready" : ""}" title="Für einen Sprung braucht ihr ${NEED} von 10.">${cells}</div>`;
}

function typeLines(el, lines) {
  const ps = lines.map(() => { const p = document.createElement("p"); el.appendChild(p); return p; });
  const ctl = { done: false, finish() { ps.forEach((p, k) => p.textContent = lines[k]); ctl.done = true; ctl.cb && ctl.cb(); } };
  if (RM) { ctl.finish(); return ctl; }
  (async () => {
    for (let k = 0; k < lines.length; k++) for (let c = 1; c <= lines[k].length; c++) {

  })();
  return ctl;
}

/* ===================== Filmsequenzen ===================== */
function cine(shots, onEnd, lastLabel) {
  const ov = document.createElement("div"); ov.className = "ov cine";
  ov.innerHTML = `<div class="ov-stage" id="cs"></div><div class="ov-bottom"><div class="cap" id="cc" aria-live="polite"></div><div class="actions"><button type="button" class="skip" id="cskip">Überspringen</button><button type="button" class="btn" id="cnext">Weiter</button></div></div>`;
  document.body.appendChild(ov);
  let i = -1, ctl = null, fxStop = null;
  const end = () => { if (fxStop) fxStop(); ov.classList.add("out"); setTimeout(() => ov.remove(), 340); onEnd(); };
  const show = k => {
    i = k; const sh = shots[k];
    if (fxStop) { fxStop(); fxStop = null; }
    $("#cs", ov).innerHTML = sh.scene() + (sh.extra || "");
    if (sh.fx) fxStop = sh.fx(ov);
    $("#cnext", ov).textContent = k === shots.length - 1 ? lastLabel : "Weiter";
    const cc = $("#cc", ov); cc.innerHTML = sh.who ? `<span class="who">${sh.who}</span>` : "";
    ctl = typeLines(cc, sh.lines);
  };
  $("#cnext", ov).onclick = () => { if (ctl && !ctl.done) return ctl.finish(); if (i < shots.length - 1) show(i + 1); else end(); };
  $("#cskip", ov).onclick = end;
  $("#cs", ov).onclick = () => $("#cnext", ov).click();
  show(0);
}

function death(id, retry, label, prefix) {

    <div class="scroll"><div class="ov-bottom"><div class="go">GAME OVER</div><h2>${d.title}</h2>

    <div class="actions"><span class="grow"></span><button type="button" class="btn" id="retry">${label}</button></div></div></div>`;

/* ===================== Zeitsprung ===================== */
function fmtAgo(ma) { if (ma <= 0.0005) return "heute"; if (ma >= 1000) return `vor ${(ma / 1000).toLocaleString("de-DE", { maximumFractionDigits: 1 })} Milliarden Jahren`; if (ma < 1) return `vor ${(Math.round(ma * 1000) * 1000).toLocaleString("de-DE")} Jahren`; return `vor ${Math.round(ma)} Millionen Jahren`; }
function jump(name, from, to, then) {
  return new Promise(res => {
    const ov = document.createElement("div"); ov.className = "ov jump";
    ov.innerHTML = `<div><div class="rings"><i></i><i></i><i></i><b></b></div><h2>Zeitsprung</h2><div class="to">${name}</div><div class="cnt" id="jc">${fmtAgo(from)}</div></div>`;
    document.body.appendChild(ov);
    const t0 = performance.now(), dur = RM ? 150 : 1700;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const el = $("#jc", ov); if (el) el.textContent = fmtAgo(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
      else { if (then) then(); setTimeout(() => { ov.classList.add("out"); setTimeout(() => { ov.remove(); res(); }, 340); }, then ? 200 : 350); }
    };
    requestAnimationFrame(step);
  });
}

/* ===================== Aufgabentypen ===================== */
function runTask(box, t, done) { if (t.type === "bins") return binsTask(box, t, done); if (t.type === "yesno") return yesnoTask(box, t, done); }

function binsTask(box, t, done) {
  const items = t.items.map((it, i) => ({ id: it.id || ("i" + i), ...it }));
  const order = shuffle(items.map(i => i.id));
  const pos = Object.fromEntries(items.map(i => [i.id, null]));
  const res = {}, gapFix = {};
  let sel = null, armed = null, checked = false;
  const cap1 = t.layout !== "bins";
  const tgt = id => t.targets.find(z => z.id === id);
  const tgLabel = id => t.layout === "order" ? "Platz " + id : t.layout === "label" ? "Nummer " + id : tgt(id).label;
  function chip(it) {
    const r = res[it.id];
    const cls = ["chip", t.layout === "order" ? "card" : "", sel === it.id ? "sel" : "", r || ""].join(" ");
    const fix = r === "bad" && it.ans && t.layout !== "cloze" ? `<span class="fix">richtig: ${tgLabel(it.ans)}</span>` : "";
    return `<button type="button" class="${cls}" data-item="${it.id}"${checked ? ' aria-disabled="true"' : ""}>${it.img ? `<span class="ci">${it.img}</span>` : ""}<span class="ct">${it.t}${fix}</span></button>`;
  }
  const zone = (id, extra) => `<div class="zone ${extra || ""} ${armed === id ? "armed" : ""}" data-zone="${id}" role="button" tabindex="0" aria-label="Feld ${tgLabel(id)}">${items.filter(i => pos[i.id] === id).map(chip).join("")}${gapFix[id] ? `<span class="fixw">richtig: ${gapFix[id]}</span>` : ""}</div>`;
  function layout() {
    const L = t.layout;
    if (L === "label") return `<div class="lab"><figure>${labelFigure()}</figure><div class="rows">${t.targets.map(z => `<div class="lrow"><span class="num">${z.id}</span>${zone(z.id)}</div>`).join("")}</div></div>`;
    if (L === "bins") return `<div class="bins">${t.targets.map(z => `<div class="bin"><div class="bin-h">${z.label}${z.sub ? `<small>${z.sub}</small>` : ""}</div>${zone(z.id)}</div>`).join("")}</div>`;
    if (L === "order") return `<div class="order" style="--n:${t.targets.length}">${t.targets.map(z => `<div class="oslot"><span class="num">${z.id}</span>${zone(z.id)}</div>`).join("")}</div><div class="order-hint"><span>1 = Landtier</span><span>${t.targets.length} = am meisten walähnlich</span></div>`;
    if (L === "match") return `<div class="match">${t.targets.map(z => `<div class="mrow"><div class="cat">${z.label}</div>${zone(z.id)}</div>`).join("")}</div>`;
    if (L === "cloze") return `<div class="cloze">${t.text.replace(/\{(g\d)\}/g, (m, g) => zone(g, "gap"))}</div>`;
  }
  function complete() {
    if (t.layout === "cloze") return t.targets.every(z => items.some(i => pos[i.id] === z.id));
    return items.filter(i => i.ans).every(i => pos[i.id] !== null);
  }
  function render() {
    const pool = order.map(byId => items.find(i => i.id === byId)).filter(i => pos[i.id] === null);
    box.className = checked ? "locked" : "";
    box.innerHTML = layout() +
      (checked ? "" : `<div class="tray"><div class="pool-l">Kärtchen${pool.length ? ` · noch ${pool.length}` : ""}${pool.length > 2 ? '<span class="swipe"> · zum Wischen</span>' : ""}</div><div class="pool" data-pool="1">${pool.map(chip).join("")}</div></div>`) +
      `<div class="fb"></div><div class="actions">${checked ? `<button type="button" class="btn" data-act="next">Weiter</button>` : `<button type="button" class="btn" data-act="check"${complete() ? "" : " disabled"}>Prüfen</button><span class="tk-how" style="margin:0">${complete() ? "Alles verteilt. Ihr habt einen Versuch." : "Verteilt erst alle Kärtchen."}</span>`}</div>`;
  }
  function labelFigure() {
    const M = [[1, 34, 74, 76, 116], [2, 360, 26, 320, 50], [3, 398, 166, 362, 136], [4, 296, 274, 322, 214]];
    return ARCHAEO.replace("</svg>", M.map(([n, x, y, fx, fy]) => `<line x1="${x}" y1="${y}" x2="${fx}" y2="${fy}" stroke="#0E7F70" stroke-width="2" stroke-dasharray="4 3"/><circle cx="${fx}" cy="${fy}" r="3.5" fill="#0E7F70"/><circle cx="${x}" cy="${y}" r="14" fill="#0E7F70"/><text x="${x}" y="${y + 6}" text-anchor="middle" font-family="Chakra Petch, Arial, sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">${n}</text>`).join("") + "</svg>");
  }
  function moveTo(id, z) {
    if (cap1) { const occ = items.find(i => pos[i.id] === z && i.id !== id); if (occ) pos[occ.id] = pos[id]; }
    pos[id] = z;
  }
  box.onclick = async e => {
    const act = e.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "next") return done();
      if (act.dataset.act === "check" && !act.disabled) return check();
      return;
    }
    if (checked) return;
    const c = e.target.closest("[data-item]"), z = e.target.closest("[data-zone]"), p = e.target.closest("[data-pool]");
    if (c) {
      const id = c.dataset.item;
      if (sel && sel !== id && pos[id] !== null) { moveTo(sel, pos[id]); sel = armed = null; return render(); }
      if (armed && pos[id] === null) { moveTo(id, armed); sel = armed = null; return render(); }
      sel = sel === id ? null : id; armed = null; return render();
    }
    if (z) { const zid = z.dataset.zone; if (sel) { moveTo(sel, zid); sel = armed = null; } else armed = armed === zid ? null : zid; return render(); }
    if (p && sel && pos[sel] !== null) { pos[sel] = null; sel = null; return render(); }
  };
  box.onkeydown = e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-zone]")) { e.preventDefault(); e.target.click(); } };
  async function check() {
    checked = true; sel = armed = null;
    let score = 0;
    if (t.layout === "cloze") {
      for (const z of t.targets) {
        const right = items.find(i => i.ans === z.id), inGap = items.find(i => pos[i.id] === z.id);
        if (inGap === right) { res[right.id] = "ok"; score++; } else { if (inGap) res[inGap.id] = "bad"; gapFix[z.id] = right.t; }
      }
    } else for (const it of items) if (it.ans) { if (pos[it.id] === it.ans) { res[it.id] = "ok"; score++; } else res[it.id] = "bad"; }
    render();
    const btn = box.querySelector('[data-act="next"]'); btn.disabled = true;
    for (let k = 0; k < score; k++) { addFuel(); await wait(170); }
    btn.disabled = false;
    fbSet(box, score === t.max ? "ok" : "info", `<b>${score} von ${t.max} richtig: +${score} ${score === 1 ? "Zelle" : "Zellen"}.</b>${score < t.max ? " Rot markiert: So wäre es richtig gewesen." : ""}`);
  }
  render();
}

function yesnoTask(box, t, done) {
  let i = 0, answered = false; const res = [];
  function show() {
    const it = t.items[i]; answered = false;
    box.innerHTML = `<div class="prog">${t.items.map((_, k) => `<i class="${res[k] === true ? "ok" : res[k] === false ? "bad" : k === i ? "cur" : ""}"></i>`).join("")}</div>
      <div class="yn">${it.img}<div><div class="cnt">Fund ${i + 1} von ${t.items.length}</div><q>${it.t}</q></div></div>
      <div class="two"><button type="button" class="opt" data-v="1">${t.yes}</button><button type="button" class="opt" data-v="0">${t.no}</button></div>
      <div class="fb"></div><div class="actions"></div>`;
  }
  box.onclick = e => {
    const b = e.target.closest("[data-v]");
    if (b && !answered) {
      answered = true;
      const it = t.items[i], right = (b.dataset.v === "1") === it.ok; res[i] = right;
      box.querySelectorAll("[data-v]").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === it.ok) x.classList.add("ok"); else if (x === b) x.classList.add("bad"); });
      if (right) addFuel();
      fbSet(box, right ? "ok" : "bad", `<b>${right ? "Richtig! +1 Zelle." : "Leider falsch."}</b> ${it.ok ? "Das ist ein Fossil." : "Das ist kein Fossil."} ${it.ex}`);
      box.querySelector(".actions").innerHTML = `<button type="button" class="btn" data-act="next">${i < t.items.length - 1 ? "Nächster Fund" : "Weiter"}</button>`;
      return;
    }
    if (e.target.closest('[data-act="next"]')) { if (i < t.items.length - 1) { i++; show(); } else done(); }
  };
  show();
}

function stormTask(box) {
  const st = S.storm;
  const ship = () => { const el = $("#ship"); if (el) el.style.left = `calc(${Math.min(1, st.ok / NEED) * 100}% * .82 + 8px)`; };
  function show() {
    const [ok, text] = st.items[st.i];
    box.innerHTML = `<div class="st-card"><div class="cnt">Frage ${st.i + 1} von 10</div><q>${text}</q>${S.cfg.timer ? '<div class="timer" id="tm"><i></i></div>' : ""}</div>
      <div class="two"><button type="button" class="opt" data-v="1">Stimmt</button><button type="button" class="opt" data-v="0">Stimmt nicht</button></div><div class="fb"></div><div class="actions"></div>`;
    ship(); fuelGauge();
    if (S.cfg.timer) {
      const T = 20000, t0 = performance.now(); let raf;
      const tick = now => { const k = Math.min(1, (now - t0) / T), bar = $("#tm i", box); if (!bar) return; bar.style.width = (100 - k * 100) + "%"; $("#tm", box).classList.toggle("low", k > .7); if (k >= 1) answer(null); else raf = requestAnimationFrame(tick); };
      raf = requestAnimationFrame(tick); stopTimer = () => cancelAnimationFrame(raf);
    }
  }
  function answer(v) {
    if (st.answered) return; st.answered = true;
    if (stopTimer) { stopTimer(); stopTimer = null; }
    const [ok, , ex] = st.items[st.i], right = v !== null && (v === "1") === ok;
    if (right) st.ok++; else st.bad++;
    box.querySelectorAll("[data-v]").forEach(x => { x.disabled = true; if ((x.dataset.v === "1") === ok) x.classList.add("ok"); else if (x.dataset.v === v) x.classList.add("bad"); });
    fuelGauge(right ? st.ok - 1 : 10 - st.bad); ship();
    fbSet(box, right ? "ok" : "bad", `<b>${right ? "Richtig!" : v === null ? "Zu langsam! Ein Blitz trifft Z-8." : "Falsch! Ein Blitz trifft Z-8."}</b> Die Aussage ${ok ? "stimmt" : "stimmt nicht"}. ${ex}`);
    const last = st.bad >= 3 || st.i === st.items.length - 1;
    box.querySelector(".actions").innerHTML = `<button type="button" class="btn${st.bad >= 3 ? " red" : ""}" data-act="next">${st.bad >= 3 ? "Oh nein ..." : last ? "Landung einleiten" : "Nächste Frage"}</button>`;
  }
  box.onclick = e => {
    const b = e.target.closest("[data-v]"); if (b && !st.answered) return answer(b.dataset.v);
    if (e.target.closest('[data-act="next"]')) {
      if (st.bad >= 3) return death("sturm", () => { S.screen = "finIntro"; render(); }, "Sturm noch einmal versuchen");
      if (st.i === st.items.length - 1) { S.cells += st.ok; return playLanding(); }
      st.i++; st.answered = false; show();
    }
  };
  st.answered = false; show();
}

/* ===================== Konfetti ===================== */
function confetti() {
  if (RM) return;
  const c = document.createElement("div"); c.className = "confetti";
  const cols = ["#F4B03E", "#5CE1CB", "#E2563C", "#7FA056", "#34B2C9", "#812B92"];
  c.innerHTML = Array.from({ length: 70 }, (_, i) => `<i style="left:${(i * 37) % 100}%;background:${cols[i % cols.length]};animation-delay:${(i % 14) * .12}s;animation-duration:${2.4 + (i % 5) * .3}s"></i>`).join("");
  document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
}

/* ===================== Lehrkraft-Menü (5x auf "Mission Rückkehr" tippen) ===================== */
function teacher() {
  const ov = document.createElement("div"); ov.className = "teach";
  const draw = () => {
    const chs = chapters();
    ov.innerHTML = `<div class="box"><div class="tk-n">Für die Lehrkraft</div><h2 style="margin:4px 0 6px">Direkt springen</h2>
      <div class="grid"><button class="btn ghost" data-t="title">Titel</button>${chs.map((c, i) => `<button class="btn ghost" data-t="c${i}">Kapitel ${i + 1}: ${c.era}</button>`).join("")}<button class="btn ghost" data-t="fin">Zeitsturm</button><button class="btn ghost" data-t="dip">Diplom</button></div>
      <label><input type="checkbox" id="opt-timer"${S.cfg.timer ? " checked" : ""}> 20-Sekunden-Timer im Zeitsturm</label>
      <label><input type="checkbox" id="opt-wal"${S.cfg.wal ? " checked" : ""}> Kapitel „Die Spur der Wale“ (nur nach der Walstunde)</label>
      <p class="tk-how" style="margin:8px 0 0">Schwelle: ${NEED} von 10 Zellen pro Kapitel. Neustart für die nächste Crew: Seite neu laden.</p>
      <div class="actions"><button class="btn" data-t="x">Schließen</button></div></div>`;
  };
  draw();
  ov.onchange = e => { if (e.target.id === "opt-timer") S.cfg.timer = e.target.checked; if (e.target.id === "opt-wal") { S.cfg.wal = e.target.checked; S.ch = Math.min(S.ch, chapters().length - 1); draw(); } };
  ov.onclick = e => {
    const b = e.target.closest("[data-t]"); if (!b) return;
    const k = b.dataset.t;
    if (!S.crew && k !== "title" && k !== "x") S.crew = "Test";
    if (!S.t0) S.t0 = Date.now();
    if (k === "title") { S.screen = "title"; render(); }
    else if (k[0] === "c") startChapter(+k.slice(1));
    else if (k === "fin") { S.ch = chapters().length - 1; S.screen = "finIntro"; render(); }
    else if (k === "dip") { S.screen = "diploma"; render(); }
    ov.remove();
  };
  document.body.appendChild(ov);
}

/* ===================== Start ===================== */
window.claude?.hot?.snapshot?.(() => JSON.parse(JSON.stringify(Object.assign({}, S, { tasks: null }))));
function boot(data) {
  if (data && data.screen && data.screen !== "title") { Object.assign(S, data); if (!S.tasks && ["task", "chIntro"].includes(S.screen)) { S.tasks = curCh().tasks(); S.ti = 0; S.fuel = 0; S.screen = "chIntro"; } if (S.screen === "storm") S.screen = "finIntro"; }
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});

</script>
