<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Übersicht der Lernapps">
  <title>Lernapps</title>

  <style>
    body {
      max-width: 48rem;
      margin: 3rem auto;
      padding: 0 1.25rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #1f2933;
      background: #fff;
    }

    h1 {
      margin-bottom: 0.5rem;
    }

    #status {
      color: #52606d;
    }

    ul {
      padding-left: 1.4rem;
    }

    li {
      margin: 0.75rem 0;
    }

    a {
      color: #075985;
      font-size: 1.1rem;
    }

    button {
      margin-top: 1rem;
      padding: 0.45rem 0.75rem;
      font: inherit;
      cursor: pointer;
    }

    .error {
      color: #9b1c1c;
    }
  </style>
</head>

<body>
  <main>
    <h1>Lernapps</h1>
    <p>Eine Anwendung auswählen:</p>

    <p id="status">Apps werden gesucht …</p>
    <ul id="app-list" hidden></ul>

    <button id="reload" type="button" hidden>
      Liste neu laden
    </button>

    <noscript>
      <p class="error">
        Für die automatische App-Liste muss JavaScript aktiviert sein.
      </p>
    </noscript>
  </main>

  <script>
    (() => {
      "use strict";

      const OWNER = "lernwerkstatt1";
      const REPOSITORY = "lernapps";
      const BRANCH = "main";

      const API_URL =
        `https://api.github.com/repos/${OWNER}/${REPOSITORY}` +
        `/git/trees/${BRANCH}?recursive=1`;

      /*
       * Neue Cache-Version, damit eine eventuell fehlerhafte
       * alte Liste nicht weiter benutzt wird.
       */
      const CACHE_KEY = `${OWNER}/${REPOSITORY}:app-index-v3`;
      const CACHE_MAX_AGE = 10 * 60 * 1000;

      const statusElement = document.getElementById("status");
      const listElement = document.getElementById("app-list");
      const reloadButton = document.getElementById("reload");

      function readableName(folderName) {
        return folderName
          .replace(/[-_]+/g, " ")
          .replace(/\b\p{L}/gu, letter => letter.toUpperCase());
      }

      function encodePath(path) {
        return path
          .split("/")
          .map(segment => encodeURIComponent(segment))
          .join("/");
      }

      function findApps(tree) {
        const filesByFolder = new Map();

        for (const item of tree) {
          if (item.type !== "blob") continue;

          /*
           * HTML-Dateien direkt in einem Unterordner erkennen.
           *
           * Beispiele:
           *
           * Blutzuckerregulationssimulator/
           *   blutzuckerregulationssimulator.html
           *
           * Bruchrechnen/
           *   index.html
           */
          const match = item.path.match(
            /^([^/]+)\/([^/]+\.html?)$/i
          );

          if (!match) continue;

          const folder = match[1];
          const fileName = match[2];

          if (
            folder.startsWith(".") ||
            folder.startsWith("_")
          ) {
            continue;
          }

          if (!filesByFolder.has(folder)) {
            filesByFolder.set(folder, []);
          }

          filesByFolder.get(folder).push({
            folder,
            fileName,
            indexPath: item.path
          });
        }

        const apps = [];

        for (const [folder, files] of filesByFolder) {

          /*
           * Auswahl, falls mehrere HTML-Dateien existieren:
           *
           * 1. index.html / index.htm
           * 2. Datei mit gleichem Namen wie der Ordner
           * 3. erste HTML-Datei alphabetisch
           */

          let selectedFile = files.find(file =>
            /^index\.html?$/i.test(file.fileName)
          );

          if (!selectedFile) {
            const normalizedFolder =
              folder
                .toLowerCase()
                .replace(/[-_\s]/g, "");

            selectedFile = files.find(file => {
              const fileWithoutExtension =
                file.fileName.replace(/\.html?$/i, "");

              const normalizedFile =
                fileWithoutExtension
                  .toLowerCase()
                  .replace(/[-_\s]/g, "");

              return normalizedFile === normalizedFolder;
            });
          }

          if (!selectedFile) {
            selectedFile = [...files].sort((a, b) =>
              a.fileName.localeCompare(
                b.fileName,
                "de",
                { sensitivity: "base" }
              )
            )[0];
          }

          apps.push(selectedFile);
        }

        return apps.sort((a, b) =>
          a.folder.localeCompare(
            b.folder,
            "de",
            { sensitivity: "base" }
          )
        );
      }

      async function readPageTitle(indexPath, fallbackTitle) {
        try {
          const response = await fetch(
            `./${encodePath(indexPath)}`,
            {
              cache: "no-cache"
            }
          );

          if (!response.ok) {
            return fallbackTitle;
          }

          const html = await response.text();

          const documentCopy =
            new DOMParser().parseFromString(
              html,
              "text/html"
            );

          const title =
            documentCopy
              .querySelector("title")
              ?.textContent
              ?.trim();

          return title || fallbackTitle;

        } catch {
          return fallbackTitle;
        }
      }

      async function addTitles(apps) {
        return Promise.all(
          apps.map(async app => ({
            ...app,
            title: await readPageTitle(
              app.indexPath,
              readableName(app.folder)
            )
          }))
        );
      }

      function render(apps, sourceMessage = "") {
        listElement.replaceChildren();

        for (const app of apps) {
          const listItem = document.createElement("li");
          const link = document.createElement("a");

          link.href = `./${encodePath(app.indexPath)}`;
          link.textContent = app.title;

          listItem.appendChild(link);
          listElement.appendChild(listItem);
        }

        listElement.hidden = false;
        reloadButton.hidden = false;

        if (apps.length === 0) {
          statusElement.textContent =
            "Es wurden keine Unterordner mit HTML-Dateien gefunden.";
          return;
        }

        statusElement.textContent =
          `${apps.length} ${
            apps.length === 1 ? "App" : "Apps"
          } gefunden` +
          (sourceMessage ? ` (${sourceMessage})` : "") +
          ".";
      }

      function readCache() {
        try {
          const cached =
            JSON.parse(localStorage.getItem(CACHE_KEY));

          if (
            !cached ||
            !Array.isArray(cached.apps)
          ) {
            return null;
          }

          return cached;

        } catch {
          return null;
        }
      }

      function writeCache(apps) {
        try {
          localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
              savedAt: Date.now(),
              apps
            })
          );
        } catch {
          // Funktioniert auch ohne localStorage.
        }
      }

      async function fetchApps({
        ignoreCache = false
      } = {}) {

        statusElement.classList.remove("error");
        statusElement.textContent =
          "Apps werden gesucht …";

        reloadButton.disabled = true;

        const cached = readCache();

        const cacheIsCurrent =
          cached &&
          Date.now() - cached.savedAt <
            CACHE_MAX_AGE;

        if (!ignoreCache && cacheIsCurrent) {
          render(
            cached.apps,
            "zwischengespeichert"
          );

          reloadButton.disabled = false;
          return;
        }

        try {

          /*
           * WICHTIG:
           * Keine zusätzlichen GitHub-Header setzen.
           *
           * Insbesondere X-GitHub-Api-Version würde
           * im Browser ein CORS-Problem verursachen.
           */
          const response = await fetch(
            API_URL,
            {
              cache: "no-cache"
            }
          );

          if (!response.ok) {
            throw new Error(
              `GitHub-API: HTTP ${response.status}`
            );
          }

          const data = await response.json();

          if (!Array.isArray(data.tree)) {
            throw new Error(
              "Die GitHub-API lieferte keine Dateiliste."
            );
          }

          const foundApps = findApps(data.tree);
          const apps = await addTitles(foundApps);

          writeCache(apps);
          render(apps);

        } catch (error) {

          console.error(error);

          if (cached) {
            render(
              cached.apps,
              "ältere gespeicherte Liste"
            );

            statusElement.textContent +=
              " Die aktuelle GitHub-Liste konnte gerade nicht geladen werden.";

          } else {
            statusElement.classList.add("error");

            statusElement.textContent =
              "Die App-Liste konnte nicht geladen werden.";

            reloadButton.hidden = false;
          }

        } finally {
          reloadButton.disabled = false;
        }
      }

      reloadButton.addEventListener(
        "click",
        () => {
          fetchApps({
            ignoreCache: true
          });
        }
      );

      fetchApps();

    })();
  </script>
</body>
</html>
